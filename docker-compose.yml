version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=production-super-secret-key-2026
      - DATABASE_URL=postgres://hero_user:hero_password@postgres:5432/hero_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hero_db
      POSTGRES_USER: hero_user
      POSTGRES_PASSWORD: hero_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
