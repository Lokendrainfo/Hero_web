services:
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/backend.Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "127.0.0.1:8018:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:8017:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hero_hdd_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "admin123"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hero_hdd_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: hero_web_recovery_postgres_data

  media_data:
    name: hero_web_recovery_media_data
    driver: local
